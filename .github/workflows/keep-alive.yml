name: Keep Supabase Alive

on:
  schedule:
    # Every 3 days at 08:17 UTC — comfortably inside Supabase's 7-day free-tier
    # inactivity window, so the project never auto-pauses.
    - cron: '17 8 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/cases?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null
