name: Keep Supabase Alive

on:
  schedule:
    # Daily at 08:17 UTC. A 3-day cadence still let the project pause once
    # (Supabase's real inactivity detection appears stricter than the
    # documented 7-day window), so this uses a tighter safety margin.
    - cron: '17 8 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/cases?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null
